<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafe Feedback Survey</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Cafe Feedback Survey</h1>
    <p>Tell us about your visit. All fields are required.</p>

    <form id="surveyForm" novalidate aria-label="Cafe feedback survey">

      <!-- Name -->
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName">
        <span class="error" id="fullNameError"></span>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
        <span class="error" id="emailError"></span>
      </div>

    <!-- Username (regex) -->
      <div class="field">
        <label for="username">Username (4 to 12 letters or numbers)</label>
        <input type="text" id="username" name="username">
        <span class="error" id="usernameError"></span>
      </div>

      <!-- Date (regex) -->
      <div class="field">
        <label for="visitDate">Date of visit (DD-MM-YYYY)</label>
        <input type="text" id="visitDate" name="visitDate" placeholder="25-12-2026">
        <span class="error" id="visitDateError"></span>
      </div>

      <!-- Receipt code (regex) -->
      <div class="field">
        <label for="receiptCode">Receipt code (format ABC-1234)</label>
        <input type="text" id="receiptCode" name="receiptCode" placeholder="ABC-1234">
        <span class="error" id="receiptCodeError"></span>
      </div>

      <!-- Radio buttons -->
      <fieldset class="field">
        <legend>How often do you visit?</legend>
        <label><input type="radio" name="frequency" value="First time"> First time</label>
        <label><input type="radio" name="frequency" value="Monthly"> Monthly</label>
        <label><input type="radio" name="frequency" value="Weekly"> Weekly</label>
        <label><input type="radio" name="frequency" value="Daily"> Daily</label>
        <span class="error" id="frequencyError"></span>
      </fieldset>

      <!-- Checkboxes -->
      <fieldset class="field">
        <legend>What did you order?</legend>
        <label><input type="checkbox" id="orderCoffee" name="orders" value="Coffee"> Coffee</label>
        <label><input type="checkbox" id="orderTea" name="orders" value="Tea"> Tea</label>
        <label><input type="checkbox" id="orderPastry" name="orders" value="Pastry"> Pastry</label>
        <label><input type="checkbox" id="orderSandwich" name="orders" value="Sandwich"> Sandwich</label>
        <span class="error" id="ordersError"></span>
      </fieldset>

      <!-- Dropdown -->
      <div class="field">
        <label for="location">Which location did you visit?</label>
        <select id="location" name="location">
          <option value="">-- Select a location --</option>
          <option value="Downtown">Downtown</option>
          <option value="Exchange District">Exchange District</option>
          <option value="St. Boniface">St. Boniface</option>
          <option value="Osborne Village">Osborne Village</option>
        </select>
        <span class="error" id="locationError"></span>
      </div>
      <!-- Number -->
      <div class="field">
        <label for="rating">Overall rating (1 to 10)</label>
        <input type="number" id="rating" name="rating" min="1" max="10">
        <span class="error" id="ratingError"></span>
      </div>

      <!-- Textarea -->
      <div class="field">
        <label for="comments">Comments (at least 10 characters)</label>
        <textarea id="comments" name="comments" rows="4"></textarea>
        <span class="error" id="commentsError"></span>
      </div>

      <button type="submit">Submit survey</button>
    </form>
